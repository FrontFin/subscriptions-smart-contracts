[package]
name = "admin-cli"
version = "0.1.0"
description = "Sync the Mesh Subscription Controller's on-chain puller-key config"
edition = "2021"

[dependencies]
anchor-lang = "1.0.1"
subscription-controller = { path = "../../programs/subscription-controller", features = ["no-entrypoint"] }
solana-rpc-client = "3"
solana-commitment-config = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
solana-message = "3"
bincode = "1"
