[package]
name = "subscription-controller"
version = "0.1.0"
description = "Mesh Subscription Controller — delegatee PDA for Solana recurring pulls"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "subscription_controller"

# The cpi/no-idl/no-log-ix-name/anchor-debug/custom-heap/custom-panic flags are
# the standard set Anchor's macros reference via #[cfg(feature = ...)]; they must
# stay declared even when unused, or the macro-generated code emits cfg warnings.
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
